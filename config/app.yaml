# Cuddle Currents — runtime configuration
# All timing values in seconds unless noted.

processing:
  resample_hz: 4.0            # uniform grid for cross-person correlation
  resample_max_gap: 3.0       # seconds: never interpolate across a hole bigger than
                              #   this (~3 beats). A straight line drawn over a
                              #   dropout is invented data shaped exactly like signal;
                              #   NaN instead, and the metrics exclude it. 0 disables.
  hr_smooth_tau: 3.0          # EMA time constant for smoothed instantaneous HR
  rmssd_window: 45.0          # rolling HRV window
  sync_window: 30.0           # sliding window for pairwise correlation / PLV
  sync_max_lag: 2.0           # +/- seconds: bounded lag scan aligns the two HR
                              #   envelopes (bands stamp beats ~0.5s apart). Keep
                              #   small — a wide search inflates uncorrelated pairs.
                              #   0 disables.
  sync_min_coverage: 0.5      # a pair must jointly have data for this fraction of the
                              #   window before a number is reported. Gaps are no
                              #   longer interpolated over, so a pair can share only a
                              #   few seconds of the window — a correlation fitted to
                              #   that (best-of a lag scan, no less) is noise dressed
                              #   as a measurement. Below it the pair reads 0 and
                              #   PersonState.coverage says why. 0 disables.
  sync_mode: zscore           # raw | zscore | baseline_delta
  stale_after_rr_factor: 2.5  # mark STALE if no beat within factor * expected RR
  sync_grace: 10.0            # keep a disconnected person in sync this long, then drop

quality:
  rr_min: 0.30                # seconds (HR 200)
  rr_max: 2.00                # seconds (HR 30)
  ectopic_pct: 0.20           # |RR_n - RR_{n-1}| > pct * local median => artifact
  dropped_ratio: 1.75         # RR ~ ratio * local median => likely dropped beat
  coverage_window: 20.0

artifact:                     # beat-level spike correction feeding HRV + synchrony
  enabled: true
  rr_min: 0.30
  rr_max: 2.00
  hampel_window: 5            # beats; local median/MAD window
  hampel_sigma: 3.0           # replace beats > sigma*MAD from local median...
  min_frac: 0.20              # ...AND > this fraction of median RR (Malik floor;
                              #    prevents over-correcting flat resting signals)
  repair: true                # split a long interval into round(rr/median) beats
                              #   (missed) / merge ~0.5x (extra) beats
  max_split: 3                # most beats one interval may be reconstructed into.
                              #   Beyond this it is a dropout, not a mis-detection:
                              #   the interval is dropped and the hole left for
                              #   resample_max_gap to render as NaN. Inventing 22
                              #   beats into a 20 s hole is not correction.

baseline:
  duration: 120.0             # rest capture length (sim shortens this)
  min_quality: 0.6            # accept baseline only if mean quality >= this
  min_beats: 60               # need at least this many clean beats

  # The enrollment capture is a SNAPSHOT: it's taken when someone has just walked in
  # (often standing, still settling), and it never updates. Anything measured relative
  # to it — the dHRV readout and the `baseline_delta` sync mode — drifts as the person
  # settles over a long session, reading a change that is really reference staleness.
  stale_after: 1800.0         # flag the baseline (and dHRV) as stale past this age, s

  # reference: which "rest" the baseline-relative readouts compare against.
  #   fixed   — the enrollment snapshot (original behaviour; drifts)
  #   rolling — a trailing self-updating estimate from the person's own recent data,
  #             which needs no operator action and can't go stale
  reference: rolling
  # 30 min. Measured tradeoff (90 min sim: settling drift + a genuine 3-min arousal
  # event): a SHORT window lets the reference absorb the very thing you're measuring —
  # at 2 min only 2.2 of a 12 bpm event survived — while reference stability keeps
  # improving with length (mean drift error 2.16 bpm at 2 min -> 0.65 at 40 min).
  # Ceiling: the beat ring holds 4096 beats, so 30 min of history exists only up to
  # ~136 bpm (60 min only up to ~68 bpm). 30 min is comfortably inside that at any
  # plausible resting HR; going longer trades responsiveness to a step change in
  # resting level and risks silent truncation (which now logs a warning).
  rolling_window: 1800.0      # trailing history the rolling reference looks at, s
  rolling_quantile: 0.10      # low quantile of HR = "my quiet level" (robust to spikes)
  rolling_min_span: 300.0     # need this much history before rolling engages;
                              #   until then the fixed baseline is used

transport:
  host: 127.0.0.1
  port: 8770                  # uncommon default to avoid collisions; override with --port
  frame_hz: 10.0              # StateFrame broadcast rate

reconnect:
  backoff_start: 1.0
  backoff_max: 16.0
  jitter: 0.3
  drop_after: 20.0            # report DISCONNECTED after this much silence/failure,
                             #   while the retry task keeps trying at backoff_max
  evict_after: 120.0         # purge an UNBOUND, absent device after this long
                             #   (bound devices are never evicted)

mqtt:
  broker: 127.0.0.1           # mosquitto host
  port: 1883
  topic_prefix: cuddle        # topics: cuddle/<gateway>/hr|status/<device>, cuddle/<gateway>/online
  max_connections: 4          # per-gateway BLE cap; conservative default, validate on hardware

orchestrator:
  enabled: false               # Phase 2: BLE->WiFi gateway orchestration (requires mqtt source)
  report_debounce: 0.5
  reconcile_interval: 5.0
  pending_ttl: 8.0
  coverage_ttl: 60.0
  rebalance_cooldown: 10.0
  evict_cooldown: 10.0
  settle_window: 4.0           # wait ~2 report cycles so every gateway reports a new band before placing it
